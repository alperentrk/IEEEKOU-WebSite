<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Kocaeli Üniversitesi IEEE Öğrenci Kolu (IEEE KOÜ) — AESS, CS ve PES komiteleri, Rover ve İHA teknik takımları ile mühendislik öğrencilerinin akademik, teknik ve kariyer gelişimini destekliyoruz."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>IEEE KOÜ | Kocaeli Üniversitesi IEEE Öğrenci Kolu</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('ieee-kou-theme')
          var theme =
            stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          document.documentElement.setAttribute('data-theme', theme)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script>
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on('init', function (user) {
          if (!user) {
            window.netlifyIdentity.on('login', function () {
              document.location.href = '/admin/'
            })
          }
        })
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
