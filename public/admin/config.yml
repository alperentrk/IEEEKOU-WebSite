# Canlı (Netlify) sürüm: Identity + Git Gateway kullanılıyor.
# Yerelde tekrar "npm run cms" ile test etmek isterseniz "local_backend: true"
# satırını geçici olarak geri ekleyebilirsiniz — ama canlıya bu satır olmadan çıkın.
backend:
  name: git-gateway
  branch: main

media_folder: "public/team"
public_folder: "/team"

collections:
  - name: "gallery"
    label: "Etkinlik Fotoğrafları"
    files:
      - name: "gallery"
        label: "Kaydırmalı Foto Galerisi"
        file: "src/data/gallery.json"
        fields:
          - label: "Fotoğraflar"
            name: "images"
            widget: "list"
            summary: "{{caption}}"
            fields:
              - {
                  label: "Fotoğraf",
                  name: "src",
                  widget: "image",
                  media_folder: "public/events",
                  public_folder: "/events",
                }
              - { label: "Açıklama", name: "caption", widget: "string" }

  - name: "about"
    label: "Hakkımızda Sayfası"
    files:
      - name: "about"
        label: "Hakkımızda İçeriği"
        file: "src/data/about.json"
        fields:
          - { label: "Üst Etiket", name: "kicker", widget: "string" }
          - { label: "Başlık", name: "title", widget: "string" }
          - { label: "Giriş Cümlesi", name: "intro", widget: "text" }
          - {
              label: "Hikaye Metni (paragraflar arasına boş satır bırakın)",
              name: "story",
              widget: "text",
            }

  - name: "home"
    label: "Ana Sayfa"
    files:
      - name: "home"
        label: "Giriş (Hero) & Misyon Kartları"
        file: "src/data/home.json"
        fields:
          - label: "Giriş Alanı (Hero)"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Ana Başlık", name: "headline", widget: "text" }
              - { label: "Paragraf", name: "paragraph", widget: "text" }
              - {
                  label: "Birincil Buton Yazısı",
                  name: "primaryButtonLabel",
                  widget: "string",
                }
              - {
                  label: "İkincil Buton Yazısı",
                  name: "secondaryButtonLabel",
                  widget: "string",
                }
              - label: "İstatistikler"
                name: "stats"
                widget: "list"
                summary: "{{value}} — {{label}}"
                fields:
                  - { label: "Değer", name: "value", widget: "string" }
                  - { label: "Etiket", name: "label", widget: "string" }
          - label: "Misyon Kartları (3 Kutu)"
            name: "aboutPillars"
            widget: "list"
            summary: "{{title}}"
            fields:
              - { label: "Başlık", name: "title", widget: "string" }
              - { label: "Açıklama", name: "text", widget: "text" }

  - name: "board"
    label: "Yönetim & İdari Kurul"
    files:
      - name: "board"
        label: "Kurul Üyeleri"
        file: "src/data/board.json"
        fields:
          - label: "Yönetim Kurulu"
            name: "executiveBoard"
            widget: "list"
            summary: "{{name}} — {{title}}"
            fields:
              - { label: "Ad Soyad", name: "name", widget: "string" }
              - { label: "Unvan", name: "title", widget: "string" }
              - {
                  label: "Baş Harfler (fotoğraf yoksa gösterilir)",
                  name: "initials",
                  widget: "string",
                }
              - {
                  label: "Fotoğraf",
                  name: "photo",
                  widget: "image",
                  required: false,
                }
          - label: "İdari Kurul & Komite Liderleri"
            name: "administrativeBoard"
            widget: "list"
            summary: "{{name}} — {{title}}"
            fields:
              - { label: "Ad Soyad", name: "name", widget: "string" }
              - { label: "Unvan", name: "title", widget: "string" }
              - {
                  label: "Baş Harfler (fotoğraf yoksa gösterilir)",
                  name: "initials",
                  widget: "string",
                }
              - {
                  label: "Fotoğraf",
                  name: "photo",
                  widget: "image",
                  required: false,
                }

  - name: "groups"
    label: "Komiteler & Takımlar"
    files:
      - name: "groups"
        label: "Komiteler & Teknik Takımlar"
        file: "src/data/groups.json"
        fields:
          - label: "Teknik Takımlar"
            name: "technicalTeams"
            widget: "list"
            summary: "{{name}}"
            fields:
              - { label: "Kısa Kod (slug)", name: "slug", widget: "string" }
              - { label: "Takım Adı", name: "name", widget: "string" }
              - { label: "Etiket", name: "tagline", widget: "string" }
              - { label: "Açıklama", name: "description", widget: "text" }
              - {
                  label: "İkon",
                  name: "icon",
                  widget: "select",
                  options: ["rover", "drone"],
                }
              - {
                  label: "Web Sitesi (opsiyonel)",
                  name: "url",
                  widget: "string",
                  required: false,
                }
          - label: "Komiteler"
            name: "committees"
            widget: "list"
            summary: "{{name}}"
            fields:
              - { label: "Kısa Kod (slug)", name: "slug", widget: "string" }
              - { label: "Kısa Ad", name: "name", widget: "string" }
              - { label: "Tam Ad", name: "fullName", widget: "string" }
              - { label: "Açıklama", name: "description", widget: "text" }
              - {
                  label: "İkon",
                  name: "icon",
                  widget: "select",
                  options: ["satellite", "cpu", "zap"],
                }
              - {
                  label: "Öncü Etkinlik",
                  name: "flagshipEvent",
                  widget: "string",
                }

  - name: "events"
    label: "Etkinlikler"
    files:
      - name: "events"
        label: "Etkinlik Listesi"
        file: "src/data/events.json"
        fields:
          - label: "Etkinlikler"
            name: "events"
            widget: "list"
            summary: "{{name}}"
            fields:
              - { label: "Kısa Kod (slug)", name: "slug", widget: "string" }
              - { label: "Etkinlik Adı", name: "name", widget: "string" }
              - { label: "Alt Başlık", name: "subtitle", widget: "string" }
              - { label: "Düzenleyen", name: "organizer", widget: "string" }
              - { label: "Açıklama", name: "description", widget: "text" }
              - {
                  label: "İkon",
                  name: "icon",
                  widget: "select",
                  options: ["briefcase", "code", "zap", "satellite"],
                }
              - {
                  label: "Amiral Etkinlik mi?",
                  name: "flagship",
                  widget: "boolean",
                  default: false,
                }

  - name: "blog"
    label: "Blog / Medium Yazıları"
    files:
      - name: "blog"
        label: "Yazılar"
        file: "src/data/blogPosts.json"
        fields:
          - label: "Yazılar"
            name: "blogPosts"
            widget: "list"
            summary: "{{title}}"
            fields:
              - { label: "Başlık", name: "title", widget: "string" }
              - { label: "Özet", name: "excerpt", widget: "text" }
              - { label: "Yazar", name: "author", widget: "string" }
              - {
                  label: "Tarih",
                  name: "date",
                  widget: "date",
                  format: "YYYY-MM-DD",
                }
              - { label: "Etiket", name: "tag", widget: "string" }
              - { label: "Medium Bağlantısı", name: "url", widget: "string" }

  - name: "achievements"
    label: "Projeler & Başarılar"
    files:
      - name: "achievements"
        label: "Başarı Listesi"
        file: "src/data/achievements.json"
        fields:
          - label: "Başarılar"
            name: "achievements"
            widget: "list"
            summary: "{{title}}"
            fields:
              - {
                  label: "Kategori",
                  name: "category",
                  widget: "select",
                  options: ["TEKNOFEST", "TÜBİTAK", "Proje"],
                }
              - { label: "Başlık", name: "title", widget: "string" }
              - { label: "Sonuç / Derece", name: "result", widget: "string" }
              - { label: "Takım", name: "team", widget: "string" }
              - { label: "Açıklama", name: "description", widget: "text" }

  - name: "site"
    label: "Site Bilgileri"
    files:
      - name: "site"
        label: "Genel Bilgiler & Sosyal Medya"
        file: "src/data/site.json"
        fields:
          - label: "Genel Bilgiler"
            name: "site"
            widget: "object"
            fields:
              - { label: "Kısa Ad", name: "shortName", widget: "string" }
              - { label: "Tam Ad", name: "fullName", widget: "string" }
              - { label: "Misyon", name: "mission", widget: "text" }
              - { label: "E-posta", name: "email", widget: "string" }
              - { label: "Adres", name: "location", widget: "string" }
              - {
                  label: "Kulüp Tanıtım Dosyası (PDF)",
                  name: "brochureUrl",
                  widget: "file",
                  media_folder: "public/docs",
                  public_folder: "/docs",
                  required: false,
                }
          - label: "Sosyal Medya Bağlantıları"
            name: "socialLinks"
            widget: "list"
            summary: "{{label}}"
            fields:
              - { label: "Etiket", name: "label", widget: "string" }
              - { label: "Bağlantı", name: "href", widget: "string" }
              - {
                  label: "İkon",
                  name: "icon",
                  widget: "select",
                  options:
                    ["instagram", "linkedin", "twitter", "youtube", "medium", "mail"],
                }
